<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d94f3d">
  <title>番茄钟 · 专注 25 分钟</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%23d94f3d'/%3E%3Cpath d='M32 18c-2-8 4-13 11-14-1 7-4 11-11 14Z' fill='%23558b67'/%3E%3Cpath d='M31 19c-6-6-14-5-18-1 5 5 11 6 18 1Z' fill='%236ba47a'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4eadf;
      --paper: #fffaf3;
      --ink: #2d2723;
      --muted: #7d6d61;
      --line: rgba(76, 53, 39, .13);
      --tomato: #d94f3d;
      --tomato-deep: #b83b2c;
      --sage: #3f7c68;
      --sage-deep: #2f6554;
      --amber: #d9992f;
      --accent: var(--tomato);
      --accent-deep: var(--tomato-deep);
      --accent-shadow: rgba(217, 79, 61, .25);
      --side: #2d2925;
      --side-soft: #a99a8c;
      --shadow: 0 32px 90px rgba(83, 48, 31, .18);
    }

    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(217, 79, 61, .17), transparent 30%),
        radial-gradient(circle at 88% 88%, rgba(63, 124, 104, .16), transparent 33%),
        linear-gradient(135deg, #f9f2e9 0%, #efe3d6 52%, #f7ede2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body[data-mode="break"] {
      --accent: var(--sage);
      --accent-deep: var(--sage-deep);
      --accent-shadow: rgba(63, 124, 104, .26);
      --side: #25332e;
    }

    button { font: inherit; color: inherit; }
    button:disabled { cursor: not-allowed; opacity: .42; }
    [hidden] { display: none !important; }

    .page {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: clamp(18px, 4vw, 52px);
      overflow: hidden;
    }
    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .34;
      background-image: radial-gradient(rgba(82, 57, 41, .22) .7px, transparent .7px);
      background-size: 22px 22px;
      mask-image: linear-gradient(180deg, #000, transparent 75%);
    }
    .page::after {
      content: "";
      position: fixed;
      z-index: 0;
      width: 42vw;
      height: 42vw;
      min-width: 300px;
      min-height: 300px;
      right: -14vw;
      top: -18vw;
      border: 1px solid rgba(217, 79, 61, .18);
      border-radius: 50%;
      box-shadow:
        0 0 0 34px rgba(217, 79, 61, .035),
        0 0 0 68px rgba(217, 79, 61, .025);
      pointer-events: none;
    }

    .site-head {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(255, 250, 243, .75);
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow: 0 10px 25px rgba(92, 54, 35, .1);
    }
    .brand-mark svg { width: 32px; height: 32px; display: block; }
    .brand h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", serif;
      font-size: clamp(22px, 2.6vw, 28px);
      letter-spacing: -.04em;
      line-height: 1.05;
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }
    .sound-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      color: #5e4c3f;
      background: rgba(255, 250, 243, .62);
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 999px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform .2s, background .2s, box-shadow .2s;
    }
    .sound-button:hover { transform: translateY(-1px); background: rgba(255, 250, 243, .9); box-shadow: 0 10px 20px rgba(83, 48, 31, .1); }
    .sound-button svg { width: 17px; height: 17px; }
    .sound-button span { font-size: 11px; font-weight: 700; letter-spacing: .06em; }

    .app-card {
      position: relative;
      z-index: 1;
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(300px, .82fr);
      overflow: hidden;
      background: rgba(255, 250, 243, .9);
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 34px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      animation: rise .65s cubic-bezier(.2, .8, .2, 1) both;
    }
    .app-card::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-deep));
      transition: background .3s;
    }

    .timer-panel {
      position: relative;
      padding: clamp(28px, 4.6vw, 54px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mode-tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: #f0e4d7;
    }
    .mode-tab {
      border: 0;
      border-radius: 999px;
      padding: 8px 16px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      transition: color .2s, background .2s, box-shadow .2s;
    }
    .mode-tab:hover { color: var(--ink); }
    .mode-tab.active {
      color: var(--ink);
      background: #fffdf9;
      box-shadow: 0 3px 10px rgba(92, 54, 35, .11);
    }

    .timer-stage {
      position: relative;
      width: clamp(274px, 33vw, 348px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      margin: 24px 0 20px;
    }
    .timer-stage::before {
      content: "";
      position: absolute;
      inset: 8.5%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, #fffefb 0%, #fffaf4 42%, #f7ecdf 100%);
      box-shadow:
        inset 0 2px 1px rgba(255, 255, 255, .95),
        inset 0 -12px 30px rgba(109, 73, 50, .045),
        0 22px 45px rgba(113, 73, 48, .08);
    }
    .timer-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
    }
    .ring-track {
      fill: none;
      stroke: #ecddcf;
      stroke-width: 9;
    }
    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-dasharray: 867.08;
      stroke-dashoffset: 0;
      filter: drop-shadow(0 0 5px var(--accent-shadow));
      transition: stroke-dashoffset .22s linear, stroke .35s ease;
    }
    .timer-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 72%;
      user-select: none;
    }
    .phase-label {
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
      transition: color .3s;
    }
    .time {
      margin-top: 7px;
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", serif;
      font-size: clamp(58px, 7.6vw, 84px);
      font-weight: 600;
      line-height: .98;
      letter-spacing: -.065em;
      font-variant-numeric: tabular-nums;
      color: #28221e;
    }
    .status {
      min-height: 20px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      letter-spacing: .02em;
    }

    .controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .02em;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s, background .18s, opacity .18s;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn:not(:disabled):hover { transform: translateY(-2px); }
    .btn:not(:disabled):active { transform: translateY(0); }
    .btn-primary {
      color: #fffaf4;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      box-shadow: 0 12px 24px var(--accent-shadow);
    }
    .btn-primary:not(:disabled):hover { box-shadow: 0 16px 28px var(--accent-shadow); }
    .btn-secondary {
      color: #4a3b31;
      background: #fffdf9;
      border-color: var(--line);
      box-shadow: 0 5px 14px rgba(92, 54, 35, .06);
    }
    .btn-ghost {
      color: #77675b;
      background: transparent;
    }
    .btn-ghost:hover { background: rgba(121, 92, 70, .07); }
    .hint {
      margin: 15px 0 0;
      color: #9a897b;
      font-size: 10px;
      letter-spacing: .05em;
    }
    .hint kbd {
      padding: 1px 5px;
      border: 1px solid #dfd0c2;
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #fffcf8;
      font-family: inherit;
      font-size: 9px;
      color: #736357;
    }

    .side-panel {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 4vw, 46px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 26px;
      color: #f9f1e8;
      background:
        radial-gradient(circle at 100% 0%, rgba(255, 255, 255, .08), transparent 38%),
        linear-gradient(160deg, var(--side), #211e1b);
      transition: background .35s;
    }
    .side-panel::before {
      content: "";
      position: absolute;
      width: 250px;
      height: 250px;
      right: -110px;
      bottom: -120px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 0 0 26px rgba(255, 255, 255, .022), 0 0 0 52px rgba(255, 255, 255, .016);
      pointer-events: none;
    }
    .side-panel > * { position: relative; z-index: 1; }
    .side-kicker {
      color: #c9b8a9;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .side-date {
      color: #9f8e80;
      font-size: 10px;
      letter-spacing: .06em;
    }
    .today-row {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin-top: 14px;
    }
    .today-row strong {
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", serif;
      font-size: clamp(58px, 7vw, 78px);
      font-weight: 500;
      line-height: .82;
      letter-spacing: -.06em;
      color: #fffaf4;
      font-variant-numeric: tabular-nums;
    }
    .today-row span { color: #c7b6a7; font-size: 12px; }
    .tomato-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 26px;
      margin: 18px 0 12px;
    }
    .tomato-dot {
      position: relative;
      width: 22px;
      height: 22px;
      border-radius: 50% 50% 47% 47%;
      border: 1px dashed rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .045);
      transition: transform .25s, background .25s, box-shadow .25s;
    }
    .tomato-dot::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      width: 10px;
      height: 7px;
      border-radius: 60% 60% 42% 42%;
      background: #6ca07c;
      transform: translateX(-50%) rotate(-9deg);
      opacity: 0;
      transition: opacity .25s;
    }
    .tomato-dot.filled {
      border: 0;
      background: linear-gradient(145deg, #f26a55, #c73c2c);
      box-shadow: 0 6px 13px rgba(217, 79, 61, .26);
      animation: pop .32s cubic-bezier(.2, 1.3, .2, 1) both;
    }
    .tomato-dot.filled::before { opacity: 1; }
    .tomato-extra {
      align-self: center;
      color: #d8c7b8;
      font-size: 10px;
      font-weight: 700;
    }
    .side-note {
      margin: 0;
      max-width: 26ch;
      color: #b5a496;
      font-size: 11px;
      line-height: 1.75;
    }
    .side-divider {
      height: 1px;
      margin: 18px 0 14px;
      background: rgba(255, 255, 255, .1);
    }
    .total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: #b5a496;
      font-size: 11px;
    }
    .total-row strong { color: #f6ecdf; font-size: 14px; font-variant-numeric: tabular-nums; }
    .side-quote {
      margin: 18px 0 0;
      color: #d8c8b9;
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", "STSong", serif;
      font-size: 13px;
      line-height: 1.7;
      letter-spacing: .01em;
    }
    .storage-note {
      margin: 20px 0 0;
      color: #8d7d70;
      font-size: 9px;
      letter-spacing: .04em;
    }

    .site-foot {
      position: relative;
      z-index: 1;
      color: #8c7b6e;
      font-size: 10px;
      letter-spacing: .06em;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 999px;
      color: #fffaf4;
      background: rgba(45, 41, 37, .92);
      box-shadow: 0 12px 28px rgba(50, 30, 20, .22);
      font-size: 12px;
      letter-spacing: .02em;
      backdrop-filter: blur(10px);
      animation: toast-in .25s ease both;
    }

    .app-card.celebrate { animation: celebrate .85s ease both; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pop {
      from { opacity: .3; transform: scale(.65); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes celebrate {
      0%, 100% { transform: scale(1); }
      35% { transform: scale(1.008); box-shadow: 0 36px 100px rgba(83, 48, 31, .24); }
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    @media (max-width: 820px) {
      .app-card { grid-template-columns: 1fr; border-radius: 28px; }
      .timer-panel { padding: 30px 24px 34px; }
      .side-panel {
        padding: 28px 30px 30px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: end;
        gap: 18px 26px;
      }
      .side-top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .side-main { grid-column: 1; }
      .side-foot { grid-column: 2; text-align: right; }
      .side-quote { display: none; }
      .storage-note { margin-top: 14px; }
      .side-divider { margin-top: 12px; }
    }

    @media (max-width: 520px) {
      .page { padding: 14px; gap: 14px; }
      .site-head { padding: 0 4px; }
      .brand p { display: none; }
      .brand-mark { width: 42px; height: 42px; border-radius: 13px; }
      .brand-mark svg { width: 28px; height: 28px; }
      .sound-button { min-height: 38px; padding: 0 11px; }
      .sound-button span { display: none; }
      .app-card { border-radius: 24px; }
      .timer-stage { width: min(78vw, 310px); margin-top: 20px; }
      .time { font-size: 60px; }
      .controls { gap: 7px; }
      .btn { min-height: 44px; padding: 0 15px; flex: 1 1 auto; }
      .btn-ghost { flex: 0 0 auto; }
      .hint { text-align: center; }
      .side-panel { grid-template-columns: 1fr; gap: 14px; padding: 24px; }
      .side-top, .side-main, .side-foot { grid-column: 1; }
      .side-foot { text-align: left; }
      .today-row strong { font-size: 54px; }
      .side-note { max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body data-mode="focus">
  <div class="page">
    <header class="site-head">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="38" r="22" fill="#d94f3d"/>
            <path d="M32 18c-2-8 4-13 11-14-1 7-4 11-11 14Z" fill="#558b67"/>
            <path d="M31 19c-6-6-14-5-18-1 5 5 11 6 18 1Z" fill="#6ba47a"/>
            <path d="M30 22c-1-4 1-7 4-9" fill="none" stroke="#3e6d50" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>番茄钟</h1>
          <p>专注 25 分钟 · 休息 5 分钟</p>
        </div>
      </div>
      <button id="soundBtn" class="sound-button" type="button" aria-label="关闭提示音" aria-pressed="true">
        <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
        <span id="soundLabel">提示音</span>
      </button>
    </header>

    <main class="app-card" id="appCard">
      <section class="timer-panel" aria-label="番茄钟计时器">
        <div class="mode-tabs" role="tablist" aria-label="计时模式">
          <button class="mode-tab active" type="button" role="tab" aria-selected="true" data-mode="focus">专注 25 分钟</button>
          <button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="break">休息 5 分钟</button>
        </div>

        <div class="timer-stage">
          <svg class="timer-ring" viewBox="0 0 320 320" aria-hidden="true">
            <circle class="ring-track" cx="160" cy="160" r="138"/>
            <circle class="ring-progress" id="ringProgress" cx="160" cy="160" r="138"/>
          </svg>
          <div class="timer-content">
            <span class="phase-label" id="phaseLabel">专注时间</span>
            <div class="time" id="timeDisplay" role="timer" aria-live="off">25:00</div>
            <div class="status" id="statusText" aria-live="polite">准备开始，按下开始进入专注</div>
          </div>
        </div>

        <div class="controls">
          <button id="startBtn" class="btn btn-primary" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.2-6.8c.6-.4.6-1.3 0-1.7L9.6 4.3c-.7-.5-1.6 0-1.6.9Z"/></svg>
            <span id="startLabel">开始专注</span>
          </button>
          <button id="pauseBtn" class="btn btn-secondary" type="button" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
            <span>暂停</span>
          </button>
          <button id="resetBtn" class="btn btn-ghost" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6"/><path d="M5.6 15a7.5 7.5 0 1 0 .4-6.2L4 10"/></svg>
            <span>重置</span>
          </button>
        </div>
        <p class="hint"><kbd>空格</kbd> 开始 / 暂停 &nbsp;·&nbsp; <kbd>R</kbd> 重置</p>
      </section>

      <aside class="side-panel" aria-label="今日番茄统计">
        <div class="side-top">
          <span class="side-kicker">今日进度</span>
          <span class="side-date" id="todayDate"></span>
        </div>

        <div class="side-main">
          <div class="today-row">
            <strong id="todayCount">0</strong>
            <span>个番茄</span>
          </div>
          <div class="tomato-row" id="tomatoRow" aria-label="今日完成的番茄"></div>
          <p class="side-note">每完成一次 25 分钟专注，就点亮一个番茄。数据会留在你的浏览器里。</p>
        </div>

        <div class="side-foot">
          <div class="side-divider"></div>
          <div class="total-row">
            <span>累计完成</span>
            <strong id="totalCount">0</strong>
          </div>
          <p class="side-quote">“一次只做一件事，慢一点也没关系。”</p>
          <p class="storage-note" id="storageNote">仅保存于本浏览器</p>
        </div>
      </aside>
    </main>

    <footer class="site-foot">双击打开即可使用 · 无需联网 · 不依赖任何外部库</footer>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    (function () {
      "use strict";

      var FOCUS_MS = 25 * 60 * 1000;
      var BREAK_MS = 5 * 60 * 1000;
      var HISTORY_KEY = "pomodoro.history.v1";
      var SOUND_KEY = "pomodoro.sound.v1";
      var RING_RADIUS = 138;
      var RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
      var WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

      var state = {
        mode: "focus",
        total: FOCUS_MS,
        remaining: FOCUS_MS,
        running: false,
        endAt: 0,
        tickId: null,
        soundOn: true,
        audioCtx: null,
        history: {},
        renderedDay: "",
        dateTimer: null,
        toastTimer: null
      };

      function $(id) { return document.getElementById(id); }

      function todayKey() {
        var now = new Date();
        var month = String(now.getMonth() + 1).padStart(2, "0");
        var day = String(now.getDate()).padStart(2, "0");
        return now.getFullYear() + "-" + month + "-" + day;
      }

      function formatTime(seconds) {
        var safe = Math.max(0, Math.floor(seconds));
        return String(Math.floor(safe / 60)).padStart(2, "0") + ":" + String(safe % 60).padStart(2, "0");
      }

      function formatDate(date) {
        return (date.getMonth() + 1) + "月" + date.getDate() + "日 · 星期" + WEEKDAYS[date.getDay()];
      }

      function storageAvailable() {
        try {
          var key = "__pomodoro_test__";
          window.localStorage.setItem(key, "1");
          window.localStorage.removeItem(key);
          return true;
        } catch (error) {
          return false;
        }
      }

      function loadHistory() {
        try {
          var raw = window.localStorage.getItem(HISTORY_KEY);
          var parsed = raw ? JSON.parse(raw) : {};
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return {};
          var cleaned = {};
          Object.keys(parsed).forEach(function (key) {
            var value = Number(parsed[key]);
            if (/^\d{4}-\d{2}-\d{2}$/.test(key) && Number.isFinite(value) && value >= 0) {
              cleaned[key] = Math.floor(value);
            }
          });
          return cleaned;
        } catch (error) {
          return {};
        }
      }

      function saveHistory() {
        try {
          window.localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history));
        } catch (error) {}
      }

      function loadSoundPreference() {
        try {
          return window.localStorage.getItem(SOUND_KEY) !== "0";
        } catch (error) {
          return true;
        }
      }

      function saveSoundPreference() {
        try {
          window.localStorage.setItem(SOUND_KEY, state.soundOn ? "1" : "0");
        } catch (error) {}
      }

      function todaysCount() {
        return state.history[todayKey()] || 0;
      }

      function totalCount() {
        return Object.keys(state.history).reduce(function (sum, key) {
          return sum + (Number(state.history[key]) || 0);
        }, 0);
      }

      function setStatus(text) {
        $("statusText").textContent = text;
      }

      function defaultStatus() {
        return state.mode === "focus" ? "准备开始，按下开始进入专注" : "准备休息，按下开始放松一下";
      }

      function renderStats() {
        var count = todaysCount();
        state.renderedDay = todayKey();
        $("todayDate").textContent = formatDate(new Date());
        $("todayCount").textContent = String(count);
        $("totalCount").textContent = String(totalCount());

        var row = $("tomatoRow");
        row.replaceChildren();
        row.setAttribute("aria-label", "今日完成 " + count + " 个番茄");
        var slots = 8;
        for (var i = 0; i < slots; i += 1) {
          var dot = document.createElement("span");
          dot.className = "tomato-dot" + (i < Math.min(count, slots) ? " filled" : "");
          row.appendChild(dot);
        }
        if (count > slots) {
          var extra = document.createElement("span");
          extra.className = "tomato-extra";
          extra.textContent = "+" + (count - slots);
          row.appendChild(extra);
        }
      }

      function render() {
        var seconds = Math.ceil(state.remaining / 1000);
        var timeText = formatTime(seconds);
        $("timeDisplay").textContent = timeText;
        $("phaseLabel").textContent = state.mode === "focus" ? "专注时间" : "休息时间";

        var progress = 1 - (state.total ? state.remaining / state.total : 0);
        $("ringProgress").style.strokeDashoffset = String(ringOffset(progress));
        $("ringProgress").style.strokeDasharray = String(RING_CIRCUMFERENCE);

        document.body.dataset.mode = state.mode;
        document.querySelectorAll(".mode-tab").forEach(function (tab) {
          var active = tab.dataset.mode === state.mode;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", active ? "true" : "false");
        });

        $("startBtn").disabled = state.running;
        $("pauseBtn").disabled = !state.running;
        $("startLabel").textContent = state.running
          ? (state.mode === "focus" ? "专注中…" : "休息中…")
          : (state.mode === "focus" ? "开始专注" : "开始休息");

        var suffix = state.running
          ? (state.mode === "focus" ? "专注中" : "休息中")
          : (state.remaining === state.total ? "准备开始" : "已暂停");
        document.title = timeText + " · " + suffix + " · 番茄钟";
      }

      function ringOffset(progress) {
        return RING_CIRCUMFERENCE * Math.min(1, Math.max(0, progress));
      }

      function stopTicker() {
        if (state.tickId !== null) {
          window.clearInterval(state.tickId);
          state.tickId = null;
        }
      }

      function startTicker() {
        stopTicker();
        state.tickId = window.setInterval(tick, 200);
      }

      function tick() {
        if (!state.running) return;
        var left = state.endAt - Date.now();
        if (left <= 0) {
          completeSession();
          return;
        }
        state.remaining = left;
        render();
      }

      function start() {
        if (state.running) return;
        if (state.remaining <= 0) state.remaining = state.total;
        ensureAudio().catch(function () {});
        state.running = true;
        state.endAt = Date.now() + state.remaining;
        setStatus(state.mode === "focus" ? "专注中，保持节奏，一次只做一件事" : "休息中，放松一下眼睛和肩膀");
        startTicker();
        render();
      }

      function pause() {
        if (!state.running) return;
        state.remaining = Math.max(0, state.endAt - Date.now());
        state.running = false;
        stopTicker();
        setStatus("已暂停，准备好后继续");
        render();
      }

      function reset() {
        state.running = false;
        stopTicker();
        state.remaining = state.total;
        setStatus(defaultStatus());
        render();
      }

      function setMode(mode, statusText) {
        state.running = false;
        stopTicker();
        state.mode = mode;
        state.total = mode === "focus" ? FOCUS_MS : BREAK_MS;
        state.remaining = state.total;
        setStatus(statusText || defaultStatus());
        render();
      }

      function completeSession() {
        var finishedMode = state.mode;
        state.running = false;
        state.remaining = 0;
        stopTicker();

        if (finishedMode === "focus") {
          var key = todayKey();
          state.history[key] = (state.history[key] || 0) + 1;
          saveHistory();
          renderStats();
          playChime("focus");
          setMode("break", "专注完成！点击开始休息 5 分钟");
          showToast("完成一个番茄！今日 " + todaysCount() + " 个");
          celebrate();
        } else {
          playChime("break");
          setMode("focus", "休息结束，准备好后开始下一轮专注");
          showToast("休息结束，继续加油");
          celebrate();
        }
      }

      function celebrate() {
        var card = $("appCard");
        card.classList.remove("celebrate");
        void card.offsetWidth;
        card.classList.add("celebrate");
        window.setTimeout(function () { card.classList.remove("celebrate"); }, 900);
      }

      function showToast(message) {
        var toast = $("toast");
        toast.textContent = message;
        toast.hidden = false;
        if (state.toastTimer !== null) window.clearTimeout(state.toastTimer);
        state.toastTimer = window.setTimeout(function () {
          toast.hidden = true;
          state.toastTimer = null;
        }, 2600);
      }

      function ensureAudio() {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return Promise.resolve(null);
        if (!state.audioCtx) state.audioCtx = new Ctx();
        var ctx = state.audioCtx;
        if (ctx.state === "suspended") {
          return ctx.resume().then(function () { return ctx; });
        }
        return Promise.resolve(ctx);
      }

      function playChime(kind) {
        if (!state.soundOn) return;
        ensureAudio().then(function (ctx) {
          if (!ctx) return;
          var notes = kind === "focus"
            ? [523.25, 659.25, 783.99, 1046.5]
            : [783.99, 659.25, 523.25];
          var start = ctx.currentTime + 0.03;
          notes.forEach(function (frequency, index) {
            var oscillator = ctx.createOscillator();
            var gain = ctx.createGain();
            var noteStart = start + index * 0.17;
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(frequency, noteStart);
            gain.gain.setValueAtTime(0.0001, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.11, noteStart + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + 0.68);
            oscillator.connect(gain);
            gain.connect(ctx.destination);
            oscillator.start(noteStart);
            oscillator.stop(noteStart + 0.72);
          });
        }).catch(function () {});
      }

      function updateSoundButton() {
        $("soundBtn").setAttribute("aria-pressed", state.soundOn ? "true" : "false");
        $("soundBtn").setAttribute("aria-label", state.soundOn ? "关闭提示音" : "开启提示音");
        $("soundLabel").textContent = state.soundOn ? "提示音" : "已静音";
        $("soundIcon").innerHTML = state.soundOn
          ? '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'
          : '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/>';
      }

      function toggleSound() {
        state.soundOn = !state.soundOn;
        saveSoundPreference();
        updateSoundButton();
        if (state.soundOn) {
          ensureAudio().then(function () { playChime("break"); }).catch(function () {});
          showToast("提示音已开启");
        } else {
          showToast("提示音已关闭");
        }
      }

      function checkDay() {
        if (todayKey() !== state.renderedDay) renderStats();
      }

      function bindEvents() {
        $("startBtn").addEventListener("click", start);
        $("pauseBtn").addEventListener("click", pause);
        $("resetBtn").addEventListener("click", reset);
        $("soundBtn").addEventListener("click", toggleSound);

        document.querySelectorAll(".mode-tab").forEach(function (tab) {
          tab.addEventListener("click", function () {
            if (tab.dataset.mode === state.mode) return;
            var mode = tab.dataset.mode === "break" ? "break" : "focus";
            setMode(mode, mode === "focus" ? "已切换到专注，按下开始" : "已切换到休息，按下开始");
          });
        });

        document.addEventListener("keydown", function (event) {
          var target = event.target;
          if (target && /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)) return;
          if (event.code === "Space") {
            event.preventDefault();
            if (state.running) pause();
            else start();
          } else if (event.key === "r" || event.key === "R") {
            event.preventDefault();
            reset();
          }
        });
      }

      function init() {
        var storageOk = storageAvailable();
        state.history = loadHistory();
        state.soundOn = loadSoundPreference();
        state.total = FOCUS_MS;
        state.remaining = FOCUS_MS;
        if (!storageOk) {
          $("storageNote").textContent = "当前浏览器无法写入本地存储，刷新后会丢失记录";
        }
        updateSoundButton();
        bindEvents();
        setMode("focus", "准备开始，按下开始进入专注");
        renderStats();
        state.dateTimer = window.setInterval(checkDay, 30000);
      }

      init();
    })();
  </script>
</body>
</html>
