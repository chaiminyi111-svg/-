services:
  telegram-inbox:
    build: .
    container_name: telegram-inbox
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
