<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f1e8">
  <title>番茄钟 · 专注 25 分钟</title>
  <style>
    :root {
      --bg: #f7f1e8;
      --bg-deep: #eee2d3;
      --card: #fffdf9;
      --ink: #302a25;
      --muted: #8c8075;
      --line: rgba(80, 60, 40, .12);
      --accent: #df523c;
      --accent-2: #f18a5d;
      --accent-deep: #b83a2b;
      --accent-soft: #fbe7e0;
      --accent-glow: rgba(223, 82, 60, .22);
      --green: #2f8a75;
      --shadow: 0 32px 80px rgba(87, 59, 36, .14), 0 4px 14px rgba(87, 59, 36, .05);
      --radius: 30px;
    }

    body.break-mode {
      --accent: #2f8a75;
      --accent-2: #68b8a5;
      --accent-deep: #226b5b;
      --accent-soft: #e2f3ef;
      --accent-glow: rgba(47, 138, 117, .20);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(241, 138, 93, .18), transparent 34%),
        radial-gradient(circle at 88% 82%, rgba(47, 138, 117, .12), transparent 32%),
        linear-gradient(135deg, var(--bg), var(--bg-deep));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image:
        linear-gradient(rgba(80, 60, 40, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80, 60, 40, .035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 40%, #000, transparent 78%);
    }

    .ambient {
      position: fixed;
      border-radius: 50%;
      filter: blur(10px);
      pointer-events: none;
      z-index: -1;
    }

    .ambient-one {
      width: 380px;
      height: 380px;
      left: -160px;
      top: 16%;
      background: radial-gradient(circle, rgba(241, 138, 93, .20), transparent 68%);
    }

    .ambient-two {
      width: 460px;
      height: 460px;
      right: -210px;
      bottom: -120px;
      background: radial-gradient(circle, rgba(47, 138, 117, .16), transparent 68%);
    }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 34px 26px 26px;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: linear-gradient(145deg, #fff8ef, #ffe4d7);
      border: 1px solid rgba(223, 82, 60, .16);
      box-shadow: 0 10px 24px rgba(223, 82, 60, .14), inset 0 1px 0 rgba(255, 255, 255, .8);
      transform: rotate(-4deg);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(20px, 2.4vw, 26px);
      letter-spacing: -.03em;
      line-height: 1.2;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .02em;
    }

    .sound-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 253, 249, .68);
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .2s ease;
      backdrop-filter: blur(10px);
    }

    .sound-button:hover { background: var(--card); color: var(--ink); transform: translateY(-1px); }
    .sound-button:active { transform: translateY(0); }
    .sound-button svg { width: 17px; height: 17px; }
    .sound-button .sound-waves { opacity: 1; transition: opacity .2s ease; }
    .sound-button.muted .sound-waves { opacity: 0; }
    .sound-button.muted { color: #a4968a; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.34fr) minmax(300px, .66fr);
      gap: 22px;
      align-items: stretch;
    }

    .timer-card,
    .stats-card {
      background: rgba(255, 253, 249, .86);
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .timer-card {
      padding: 24px 28px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 620px;
      position: relative;
      overflow: hidden;
    }

    .timer-card::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      right: -140px;
      top: -150px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow), transparent 68%);
      pointer-events: none;
    }

    .mode-tabs {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(246, 237, 228, .76);
      position: relative;
      z-index: 1;
    }

    .mode-tab {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 9px 16px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      transition: background .25s ease, color .25s ease, box-shadow .25s ease;
    }

    .mode-tab span {
      font-size: 10px;
      font-weight: 650;
      opacity: .68;
      font-variant-numeric: tabular-nums;
    }

    .mode-tab:hover { color: var(--ink); }

    .mode-tab.active {
      color: var(--accent-deep);
      background: var(--card);
      box-shadow: 0 5px 16px rgba(87, 59, 36, .10), inset 0 1px 0 rgba(255, 255, 255, .9);
    }

    .timer-stage {
      width: min(360px, 74vw);
      aspect-ratio: 1;
      margin: 30px auto 8px;
      position: relative;
      flex: 0 0 auto;
    }

    .ring {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: rgba(223, 82, 60, .10);
      stroke-width: 13;
    }

    body.break-mode .ring-track { stroke: rgba(47, 138, 117, .12); }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 13;
      stroke-linecap: round;
      transition: stroke-dashoffset .28s linear, stroke .35s ease;
      filter: drop-shadow(0 7px 12px var(--accent-glow));
    }

    .time-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .mode-label {
      color: var(--accent-deep);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .24em;
      text-indent: .24em;
      text-transform: uppercase;
      margin-bottom: 8px;
      transition: color .35s ease;
    }

    .time-display {
      font-size: clamp(58px, 10.5vw, 88px);
      line-height: .95;
      font-weight: 800;
      letter-spacing: -.06em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      text-shadow: 0 3px 0 rgba(255, 255, 255, .6);
    }

    .timer-hint {
      margin-top: 14px;
      min-height: 20px;
      max-width: 240px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      transition: color .3s ease;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
      position: relative;
      z-index: 1;
    }

    .btn {
      min-width: 116px;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 13px 21px;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .02em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform .18s ease, box-shadow .18s ease, background .2s ease, color .2s ease, border-color .2s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-2px); }
    .btn:active:not(:disabled) { transform: translateY(0); }

    .btn:disabled {
      opacity: .42;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn.primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 26px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, .24);
    }

    .btn.primary:hover:not(:disabled) { box-shadow: 0 16px 30px var(--accent-glow); }

    .btn.secondary {
      color: var(--accent-deep);
      background: var(--accent-soft);
      border-color: rgba(223, 82, 60, .12);
    }

    body.break-mode .btn.secondary { border-color: rgba(47, 138, 117, .14); }

    .btn.ghost {
      color: var(--muted);
      background: transparent;
      border-color: var(--line);
    }

    .btn.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .7); color: var(--ink); }

    .session-line {
      margin-top: 18px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .02em;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 1;
    }

    .session-line strong { color: var(--accent-deep); font-weight: 800; }
    .session-line .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-2); opacity: .7; }

    .stats-card {
      padding: 26px 24px 22px;
      display: flex;
      flex-direction: column;
      min-height: 620px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .stats-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .count-line {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-top: 2px;
    }

    .count-line strong {
      font-size: clamp(58px, 8vw, 78px);
      line-height: .9;
      font-weight: 800;
      letter-spacing: -.07em;
      color: var(--accent-deep);
      font-variant-numeric: tabular-nums;
      transition: color .35s ease;
    }

    .count-line span { color: var(--muted); font-size: 12px; font-weight: 650; }

    .tomato-badge {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 25px;
      border-radius: 16px;
      background: var(--accent-soft);
      transform: rotate(5deg);
      flex: 0 0 auto;
    }

    .goal-block {
      margin-top: 22px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .48);
    }

    .goal-head,
    .week-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .goal-head strong,
    .week-head strong { color: var(--ink); font-weight: 800; }

    .goal-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 11px;
      flex-wrap: wrap;
    }

    .goal-dot {
      width: 23px;
      height: 23px;
      border-radius: 50%;
      border: 1.5px solid rgba(223, 82, 60, .22);
      background: transparent;
      display: grid;
      place-items: center;
      color: transparent;
      font-size: 11px;
      transition: background .25s ease, border-color .25s ease, color .25s ease, transform .25s ease;
    }

    .goal-dot.filled {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
      transform: scale(1.03);
      box-shadow: 0 4px 10px var(--accent-glow);
    }

    body.break-mode .goal-dot { border-color: rgba(47, 138, 117, .24); }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 20px 0 17px;
    }

    .week-head { margin-bottom: 10px; }

    .week-chart {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
      height: 132px;
      align-items: stretch;
    }

    .week-day {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      min-width: 0;
      height: 100%;
    }

    .week-count {
      height: 15px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .week-track {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 0;
    }

    .week-bar {
      width: min(22px, 80%);
      min-height: 4px;
      border-radius: 7px 7px 3px 3px;
      background: rgba(223, 82, 60, .20);
      transition: height .45s cubic-bezier(.2, .8, .2, 1), background .25s ease;
    }

    body.break-mode .week-bar { background: rgba(47, 138, 117, .18); }

    .week-day.has-count .week-bar {
      background: linear-gradient(180deg, var(--accent-2), var(--accent));
    }

    .week-day.today .week-bar {
      background: linear-gradient(180deg, var(--accent), var(--accent-deep));
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .week-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 650;
      white-space: nowrap;
    }

    .week-day.today .week-label { color: var(--accent-deep); font-weight: 800; }

    .storage-note {
      margin: auto 0 0;
      padding-top: 18px;
      color: #a29487;
      font-size: 10px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 7px;
    }

    .storage-note svg { width: 13px; height: 13px; flex: 0 0 auto; margin-top: 1px; }
    .storage-note.warn { color: #b0644f; }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #a29487;
      font-size: 11px;
      line-height: 1.7;
    }

    .footer kbd {
      display: inline-block;
      min-width: 20px;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: rgba(255, 253, 249, .72);
      color: var(--muted);
      font: inherit;
      font-size: 9px;
      font-weight: 700;
      line-height: 1.4;
    }

    .footer .sep { margin: 0 8px; opacity: .45; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 18px);
      max-width: calc(100vw - 36px);
      padding: 11px 16px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 12px;
      background: rgba(48, 42, 37, .92);
      color: #fff;
      font-size: 12px;
      font-weight: 650;
      line-height: 1.45;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 14px 34px rgba(30, 20, 12, .22);
      transition: opacity .22s ease, transform .22s ease;
      z-index: 20;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    button:focus-visible {
      outline: 3px solid rgba(223, 82, 60, .32);
      outline-offset: 3px;
    }

    body.break-mode button:focus-visible { outline-color: rgba(47, 138, 117, .32); }

    @media (max-width: 860px) {
      .app { padding: 24px 18px 22px; }
      .layout { grid-template-columns: 1fr; }
      .timer-card { min-height: auto; padding: 22px 20px 24px; }
      .stats-card { min-height: auto; }
      .timer-stage { margin-top: 24px; }
      .storage-note { margin-top: 18px; }
    }

    @media (max-width: 520px) {
      .topbar { align-items: flex-start; }
      .brand p { max-width: 170px; line-height: 1.45; }
      .sound-button span { display: none; }
      .sound-button { padding: 10px; }
      .timer-card { padding: 18px 14px 22px; border-radius: 24px; }
      .stats-card { padding: 22px 18px 20px; border-radius: 24px; }
      .mode-tab { padding: 8px 12px; }
      .controls { width: 100%; }
      .btn { flex: 1 1 0; min-width: 0; padding: 13px 10px; }
      .timer-hint { max-width: 200px; }
      .week-chart { height: 112px; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="30" height="30" fill="none">
            <path d="M16 9c6.1 0 10.5 4.1 10.5 9.6C26.5 24.8 21.9 28 16 28S5.5 24.8 5.5 18.6C5.5 13.1 9.9 9 16 9Z" fill="#df523c"/>
            <path d="M16 9c-2.1-2.2-4.8-2.8-7.6-2.1 1.2 1.5 2.6 2.5 4.4 3.1-1.2.1-2.4.6-3.4 1.4 2.8.8 5.3.5 7.3-.9 2 1.4 4.5 1.7 7.3.9-1-.8-2.2-1.3-3.4-1.4 1.8-.6 3.2-1.6 4.4-3.1-2.8-.7-5.5-.1-7.6 2.1Z" fill="#2f8a75"/>
            <path d="M16 9V5" stroke="#2f8a75" stroke-width="2" stroke-linecap="round"/>
            <path d="M10.5 15.5c.9-1.3 2.2-2 3.8-2.1" stroke="#f7a08c" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
          </svg>
        </div>
        <div>
          <h1>番茄钟</h1>
          <p>专注 25 分钟，休息 5 分钟</p>
        </div>
      </div>
      <button id="soundToggle" class="sound-button" type="button" aria-pressed="true" title="开启或关闭结束提示音">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
          <path class="sound-waves" d="M15.2 8.6a4.8 4.8 0 0 1 0 6.8"></path>
          <path class="sound-waves" d="M18.1 6a8.2 8.2 0 0 1 0 12"></path>
        </svg>
        <span id="soundLabel">声音开</span>
      </button>
    </header>

    <section class="layout">
      <div class="timer-card">
        <div class="mode-tabs" role="tablist" aria-label="计时模式">
          <button class="mode-tab active" type="button" data-mode="focus" role="tab" aria-selected="true">
            专注 <span>25:00</span>
          </button>
          <button class="mode-tab" type="button" data-mode="break" role="tab" aria-selected="false">
            休息 <span>05:00</span>
          </button>
        </div>

        <div class="timer-stage">
          <svg class="ring" viewBox="0 0 320 320" aria-hidden="true">
            <circle class="ring-track" cx="160" cy="160" r="140"></circle>
            <circle id="ringProgress" class="ring-progress" cx="160" cy="160" r="140"></circle>
          </svg>
          <div class="time-wrap">
            <div id="modeLabel" class="mode-label">专注时间</div>
            <div id="timeDisplay" class="time-display" role="timer" aria-live="off">25:00</div>
            <div id="timerHint" class="timer-hint" aria-live="polite">准备好就开始吧</div>
          </div>
        </div>

        <div class="controls">
          <button id="startBtn" class="btn primary" type="button">▶ 开始</button>
          <button id="pauseBtn" class="btn secondary" type="button" disabled>❚❚ 暂停</button>
          <button id="resetBtn" class="btn ghost" type="button">↺ 重置</button>
        </div>

        <div class="session-line">
          <span class="dot" aria-hidden="true"></span>
          <span id="sessionNumber">今日第 1 个番茄</span>
        </div>
      </div>

      <aside class="stats-card" aria-label="今日番茄统计">
        <div class="stats-head">
          <div>
            <p class="eyebrow">今日成果</p>
            <div class="count-line">
              <strong id="todayCount">0</strong>
              <span>个番茄</span>
            </div>
          </div>
          <div class="tomato-badge" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="27" height="27" fill="none">
              <path d="M16 9c6.1 0 10.5 4.1 10.5 9.6C26.5 24.8 21.9 28 16 28S5.5 24.8 5.5 18.6C5.5 13.1 9.9 9 16 9Z" fill="#df523c"/>
              <path d="M16 9c-2.1-2.2-4.8-2.8-7.6-2.1 1.2 1.5 2.6 2.5 4.4 3.1-1.2.1-2.4.6-3.4 1.4 2.8.8 5.3.5 7.3-.9 2 1.4 4.5 1.7 7.3.9-1-.8-2.2-1.3-3.4-1.4 1.8-.6 3.2-1.6 4.4-3.1-2.8-.7-5.5-.1-7.6 2.1Z" fill="#2f8a75"/>
              <path d="M16 9V5" stroke="#2f8a75" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <div class="goal-block">
          <div class="goal-head">
            <span>今日目标</span>
            <strong id="goalText">0 / 8</strong>
          </div>
          <div id="goalDots" class="goal-dots" aria-label="今日目标进度"></div>
        </div>

        <div class="divider"></div>

        <div class="week-head">
          <span>最近 7 天</span>
          <strong id="weekTotal">共 0 个</strong>
        </div>
        <div id="weekChart" class="week-chart" aria-label="最近七天完成数量"></div>

        <p id="storageNote" class="storage-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          </svg>
          <span>完成记录只保存在这台设备的浏览器里。</span>
        </p>
      </aside>
    </section>

    <footer class="footer">
      <kbd>空格</kbd> 开始 / 暂停 <span class="sep">·</span> <kbd>R</kbd> 重置 <span class="sep">·</span> <kbd>1</kbd> 专注 <span class="sep">·</span> <kbd>2</kbd> 休息
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      var FOCUS_SECONDS = 25 * 60;
      var BREAK_SECONDS = 5 * 60;
      var DAILY_GOAL = 8;
      var STORAGE_KEY = "pomodoro.daily.v1";
      var SOUND_KEY = "pomodoro.sound.v1";
      var RING_RADIUS = 140;
      var RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

      var durations = { focus: FOCUS_SECONDS, break: BREAK_SECONDS };
      var mode = "focus";
      var remaining = FOCUS_SECONDS;
      var running = false;
      var deadline = 0;
      var tickHandle = null;
      var lastDay = dateKey(new Date());
      var toastHandle = null;
      var audioContext = null;
      var memoryHistory = {};
      var storageWorks = true;
      var soundOn = readSoundPreference();

      var timeDisplay = document.getElementById("timeDisplay");
      var modeLabel = document.getElementById("modeLabel");
      var timerHint = document.getElementById("timerHint");
      var startBtn = document.getElementById("startBtn");
      var pauseBtn = document.getElementById("pauseBtn");
      var resetBtn = document.getElementById("resetBtn");
      var ringProgress = document.getElementById("ringProgress");
      var todayCountEl = document.getElementById("todayCount");
      var goalText = document.getElementById("goalText");
      var goalDots = document.getElementById("goalDots");
      var weekChart = document.getElementById("weekChart");
      var weekTotal = document.getElementById("weekTotal");
      var sessionNumber = document.getElementById("sessionNumber");
      var storageNote = document.getElementById("storageNote");
      var soundToggle = document.getElementById("soundToggle");
      var soundLabel = document.getElementById("soundLabel");
      var toast = document.getElementById("toast");

      ringProgress.style.strokeDasharray = String(RING_CIRCUMFERENCE);

      function dateKey(date) {
        var year = date.getFullYear();
        var month = String(date.getMonth() + 1).padStart(2, "0");
        var day = String(date.getDate()).padStart(2, "0");
        return year + "-" + month + "-" + day;
      }

      function readHistory() {
        try {
          var raw = window.localStorage.getItem(STORAGE_KEY);
          storageWorks = true;
          if (!raw) return Object.assign({}, memoryHistory);
          var parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
            return Object.assign({}, memoryHistory);
          }
          var clean = {};
          Object.keys(parsed).forEach(function (key) {
            var value = Number(parsed[key]);
            if (/^\d{4}-\d{2}-\d{2}$/.test(key) && Number.isFinite(value) && value > 0) {
              clean[key] = Math.floor(value);
            }
          });
          memoryHistory = clean;
          return Object.assign({}, clean);
        } catch (error) {
          storageWorks = false;
          return Object.assign({}, memoryHistory);
        }
      }

      function writeHistory(history) {
        memoryHistory = Object.assign({}, history);
        try {
          var cutoff = new Date();
          cutoff.setDate(cutoff.getDate() - 120);
          var cutoffKey = dateKey(cutoff);
          var pruned = {};
          Object.keys(history).forEach(function (key) {
            if (key >= cutoffKey) pruned[key] = history[key];
          });
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(pruned));
          storageWorks = true;
        } catch (error) {
          storageWorks = false;
        }
      }

      function todayCount(history) {
        return Number(history[dateKey(new Date())] || 0);
      }

      function incrementToday() {
        var history = readHistory();
        var key = dateKey(new Date());
        history[key] = Number(history[key] || 0) + 1;
        writeHistory(history);
        return history;
      }

      function readSoundPreference() {
        try {
          var stored = window.localStorage.getItem(SOUND_KEY);
          if (stored === "off") return false;
          if (stored === "on") return true;
        } catch (error) {}
        return true;
      }

      function saveSoundPreference() {
        try {
          window.localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off");
        } catch (error) {}
      }

      function formatTime(seconds) {
        var total = Math.max(0, Math.ceil(seconds));
        var minutes = Math.floor(total / 60);
        var secs = total % 60;
        return String(minutes).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
      }

      function renderTimer() {
        var total = durations[mode];
        var ratio = Math.max(0, Math.min(1, remaining / total));
        timeDisplay.textContent = formatTime(remaining);
        ringProgress.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - ratio));
        document.title = running
          ? formatTime(remaining) + " · " + (mode === "focus" ? "专注中" : "休息中") + " · 番茄钟"
          : "番茄钟 · 专注 25 分钟";
        updateButtons();
      }

      function updateButtons() {
        startBtn.disabled = running;
        pauseBtn.disabled = !running;
        var pausedWithProgress = !running && remaining > 0 && remaining < durations[mode];
        startBtn.textContent = pausedWithProgress ? "▶ 继续" : "▶ 开始";
      }

      function setHint(text) {
        timerHint.textContent = text;
      }

      function updateModeUi() {
        var isBreak = mode === "break";
        document.body.classList.toggle("break-mode", isBreak);
        modeLabel.textContent = isBreak ? "休息时间" : "专注时间";
        document.querySelectorAll(".mode-tab").forEach(function (tab) {
          var active = tab.dataset.mode === mode;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", active ? "true" : "false");
        });
        renderStats();
      }

      function setMode(nextMode, options) {
        options = options || {};
        if (!durations[nextMode]) return;
        if (nextMode === mode && !options.force) return;
        if (running && !options.force) {
          var ok = window.confirm("切换模式会重置当前计时，确定吗？");
          if (!ok) return;
        }
        running = false;
        stopTicking();
        mode = nextMode;
        remaining = durations[mode];
        deadline = 0;
        updateModeUi();
        renderTimer();
        setHint(mode === "focus" ? "准备好就开始吧" : "起身活动一下，看看远处");
        if (options.autoStart) startTimer();
      }

      function startTimer() {
        if (running) return;
        ensureAudio();
        if (remaining <= 0) remaining = durations[mode];
        running = true;
        deadline = Date.now() + remaining * 1000;
        setHint(mode === "focus" ? "保持专注，别切走太久" : "放松一下，给眼睛放个假");
        renderTimer();
        stopTicking();
        tickHandle = window.setInterval(tick, 200);
        tick();
      }

      function pauseTimer() {
        if (!running) return;
        remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        running = false;
        stopTicking();
        renderTimer();
        setHint("已暂停，准备好再继续");
      }

      function resetTimer() {
        running = false;
        stopTicking();
        remaining = durations[mode];
        deadline = 0;
        renderTimer();
        setHint(mode === "focus" ? "已重置，准备好就开始吧" : "已重置，准备好就休息吧");
      }

      function stopTicking() {
        if (tickHandle !== null) {
          window.clearInterval(tickHandle);
          tickHandle = null;
        }
      }

      function tick() {
        if (!running) return;
        var msLeft = deadline - Date.now();
        if (msLeft <= 0) {
          remaining = 0;
          renderTimer();
          finishSession();
          return;
        }
        remaining = Math.max(1, Math.ceil(msLeft / 1000));
        renderTimer();
        var nowDay = dateKey(new Date());
        if (nowDay !== lastDay) {
          lastDay = nowDay;
          renderStats();
        }
      }

      function finishSession() {
        if (!running) return;
        running = false;
        stopTicking();
        var finishedMode = mode;

        if (finishedMode === "focus") {
          incrementToday();
          playFinishMusic("focus");
          renderStats();
          setMode("break", { force: true, autoStart: true });
          showToast("完成一个番茄！休息 5 分钟");
        } else {
          playFinishMusic("break");
          setMode("focus", { force: true, autoStart: false });
          setHint("休息结束，准备好就开始下一个番茄");
          renderStats();
          showToast("休息结束，继续加油");
        }
      }

      function renderStats() {
        var history = readHistory();
        var count = todayCount(history);
        todayCountEl.textContent = String(count);
        goalText.textContent = count >= DAILY_GOAL ? count + " / " + DAILY_GOAL + " ✓" : count + " / " + DAILY_GOAL;

        goalDots.replaceChildren();
        for (var index = 0; index < DAILY_GOAL; index += 1) {
          var dot = document.createElement("span");
          dot.className = "goal-dot" + (index < count ? " filled" : "");
          dot.textContent = index < count ? "✓" : "";
          dot.setAttribute("aria-hidden", "true");
          goalDots.appendChild(dot);
        }
        goalDots.setAttribute("aria-label", "今日完成 " + count + " 个，目标 " + DAILY_GOAL + " 个");

        var days = [];
        var total = 0;
        for (var offset = 6; offset >= 0; offset -= 1) {
          var date = new Date();
          date.setHours(12, 0, 0, 0);
          date.setDate(date.getDate() - offset);
          var key = dateKey(date);
          var value = Number(history[key] || 0);
          total += value;
          days.push({
            key: key,
            count: value,
            label: ["日", "一", "二", "三", "四", "五", "六"][date.getDay()],
            today: offset === 0
          });
        }

        var maxCount = Math.max(1, Math.max.apply(null, days.map(function (day) { return day.count; })));
        weekChart.replaceChildren();
        days.forEach(function (day) {
          var wrap = document.createElement("div");
          wrap.className = "week-day" + (day.today ? " today" : "") + (day.count > 0 ? " has-count" : "");
          wrap.title = day.key + "：" + day.count + " 个番茄";

          var countEl = document.createElement("span");
          countEl.className = "week-count";
          countEl.textContent = day.count > 0 ? String(day.count) : "·";

          var track = document.createElement("div");
          track.className = "week-track";
          var bar = document.createElement("div");
          bar.className = "week-bar";
          var height = day.count > 0 ? Math.max(10, Math.round((day.count / maxCount) * 100)) : 4;
          bar.style.height = height + "%";
          track.appendChild(bar);

          var label = document.createElement("span");
          label.className = "week-label";
          label.textContent = day.label;

          wrap.append(countEl, track, label);
          weekChart.appendChild(wrap);
        });
        weekTotal.textContent = "共 " + total + " 个";

        if (mode === "focus") {
          sessionNumber.textContent = "今日第 " + (count + 1) + " 个番茄";
        } else {
          sessionNumber.textContent = "休息一下，回来继续";
        }

        storageNote.classList.toggle("warn", !storageWorks);
        var storageText = storageNote.querySelector("span");
        if (storageText) {
          storageText.textContent = storageWorks
            ? "完成记录只保存在这台设备的浏览器里。"
            : "浏览器禁用了本地存储，本次记录无法保存。";
        }
      }

      function updateSoundUi() {
        soundToggle.classList.toggle("muted", !soundOn);
        soundToggle.setAttribute("aria-pressed", soundOn ? "true" : "false");
        soundLabel.textContent = soundOn ? "声音开" : "声音关";
        soundToggle.title = soundOn ? "关闭结束提示音" : "开启结束提示音";
      }

      function ensureAudio() {
        if (audioContext) {
          if (audioContext.state === "suspended") {
            audioContext.resume().catch(function () {});
          }
          return audioContext;
        }
        var AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        try {
          audioContext = new AudioCtor();
          if (audioContext.state === "suspended") {
            audioContext.resume().catch(function () {});
          }
        } catch (error) {
          audioContext = null;
        }
        return audioContext;
      }

      function tone(context, frequency, start, duration, volume, type) {
        var oscillator = context.createOscillator();
        var gain = context.createGain();
        oscillator.type = type || "triangle";
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.06);
      }

      function playFinishMusic(kind) {
        if (!soundOn) return;
        var context = ensureAudio();
        if (!context) return;
        if (context.state === "suspended") {
          context.resume().catch(function () {});
        }
        var now = context.currentTime + 0.04;
        var melody = kind === "focus"
          ? [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.51]
          : [783.99, 659.25, 523.25, 659.25, 523.25, 392.0];
        var step = kind === "focus" ? 0.17 : 0.20;
        melody.forEach(function (frequency, index) {
          var start = now + index * step;
          tone(context, frequency, start, 0.44, 0.13, "triangle");
          tone(context, frequency / 2, start, 0.55, 0.045, "sine");
        });
        tone(context, kind === "focus" ? 261.63 : 196.0, now, 1.35, 0.045, "sine");
      }

      function playClickTone() {
        if (!soundOn) return;
        var context = ensureAudio();
        if (!context) return;
        if (context.state === "suspended") context.resume().catch(function () {});
        tone(context, 880, context.currentTime + 0.02, 0.14, 0.06, "sine");
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        if (toastHandle !== null) window.clearTimeout(toastHandle);
        toastHandle = window.setTimeout(function () {
          toast.classList.remove("show");
          toastHandle = null;
        }, 3600);
      }

      document.querySelectorAll(".mode-tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          setMode(tab.dataset.mode);
        });
      });

      startBtn.addEventListener("click", startTimer);
      pauseBtn.addEventListener("click", pauseTimer);
      resetBtn.addEventListener("click", resetTimer);

      soundToggle.addEventListener("click", function () {
        soundOn = !soundOn;
        saveSoundPreference();
        updateSoundUi();
        if (soundOn) {
          ensureAudio();
          playClickTone();
        }
      });

      document.addEventListener("keydown", function (event) {
        var tag = event.target && event.target.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || event.target.isContentEditable) return;
        if (event.code === "Space") {
          event.preventDefault();
          if (running) pauseTimer();
          else startTimer();
        } else if (event.key === "r" || event.key === "R") {
          event.preventDefault();
          resetTimer();
        } else if (event.key === "1") {
          setMode("focus");
        } else if (event.key === "2") {
          setMode("break");
        }
      });

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          if (running) tick();
          renderStats();
        }
      });

      window.addEventListener("storage", function (event) {
        if (event.key === STORAGE_KEY) renderStats();
        if (event.key === SOUND_KEY) {
          soundOn = event.newValue !== "off";
          updateSoundUi();
        }
      });

      window.setInterval(function () {
        var nowDay = dateKey(new Date());
        if (nowDay !== lastDay) {
          lastDay = nowDay;
          renderStats();
        }
      }, 30000);

      updateSoundUi();
      updateModeUi();
      renderTimer();
      renderStats();
      setHint("准备好就开始吧");
    }());
  </script>
</body>
</html>
