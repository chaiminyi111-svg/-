<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<style>
  :root {
    --bg: #14161c;
    --card: #1c2029;
    --text: #f2f4f8;
    --muted: #8b93a7;
    --focus: #ff6b5b;
    --break: #3ecf8e;
    --accent: var(--focus);
    --track: #2a2f3a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 0%, #232838 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .app {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .tabs {
    display: inline-flex;
    gap: 4px;
    padding: 4px;
    margin-bottom: 28px;
    border-radius: 999px;
    background: var(--card);
  }

  .tab {
    border: 0;
    padding: 9px 22px;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background .2s, color .2s;
  }

  .tab[aria-selected="true"] {
    background: var(--accent);
    color: #12141a;
    font-weight: 600;
  }

  .dial {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 32px;
  }

  .dial svg {
    display: block;
    transform: rotate(-90deg);
  }

  .dial .track { stroke: var(--track); }
  .dial .progress {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset .3s linear, stroke .3s;
  }

  .dial-face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .time {
    font-size: 56px;
    font-weight: 300;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }

  .label {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--muted);
  }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .btn {
    border: 0;
    border-radius: 12px;
    padding: 13px 30px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .12s, filter .2s, background .2s;
  }

  .btn:active { transform: scale(.97); }

  .btn-primary {
    background: var(--accent);
    color: #12141a;
    font-weight: 600;
    flex: 1;
    max-width: 190px;
  }

  .btn-primary:hover { filter: brightness(1.08); }

  .btn-ghost {
    background: var(--card);
    color: var(--text);
  }

  .btn-ghost:hover { background: #262b36; }

  .stats {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-radius: 14px;
    background: var(--card);
    font-size: 14px;
    color: var(--muted);
  }

  .stats strong {
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
  }

  .dots {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 140px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--track);
  }

  .dot.done { background: var(--focus); }

  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: #5f6678;
  }

  @media (max-width: 360px) {
    .dial { width: 240px; height: 240px; }
    .time { font-size: 46px; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="tabs" role="tablist" aria-label="计时模式">
    <button class="tab" id="tab-focus" role="tab" aria-selected="true" data-mode="focus">专注</button>
    <button class="tab" id="tab-break" role="tab" aria-selected="false" data-mode="break">休息</button>
  </div>

  <div class="dial">
    <svg width="280" height="280" viewBox="0 0 280 280" aria-hidden="true">
      <circle class="track" cx="140" cy="140" r="126" fill="none" stroke-width="10"></circle>
      <circle class="progress" id="progress" cx="140" cy="140" r="126" fill="none" stroke-width="10"></circle>
    </svg>
    <div class="dial-face">
      <div class="time" id="time" role="timer" aria-live="off">25:00</div>
      <div class="label" id="mode-label">专注时间</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="start">开始</button>
    <button class="btn btn-ghost" id="reset">重置</button>
  </div>

  <div class="stats">
    <span>今日完成 <strong id="count">0</strong> 个番茄</span>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>

  <p class="hint">空格键 开始 / 暂停 · R 键 重置</p>
</main>

<script>
(function () {
  "use strict";

  var FOCUS_SECONDS = 25 * 60;
  var BREAK_SECONDS = 5 * 60;
  var STORAGE_KEY = "pomodoro.stats.v1";
  var RING_LENGTH = 2 * Math.PI * 126;

  var els = {
    time: document.getElementById("time"),
    progress: document.getElementById("progress"),
    modeLabel: document.getElementById("mode-label"),
    start: document.getElementById("start"),
    reset: document.getElementById("reset"),
    count: document.getElementById("count"),
    dots: document.getElementById("dots"),
    tabFocus: document.getElementById("tab-focus"),
    tabBreak: document.getElementById("tab-break")
  };

  var mode = "focus";
  var total = FOCUS_SECONDS;
  var remaining = FOCUS_SECONDS;
  var running = false;
  var endAt = 0;
  var ticker = null;
  var audioCtx = null;

  els.progress.style.strokeDasharray = RING_LENGTH;

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function loadStats() {
    var stats = { date: todayKey(), count: 0 };
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.date === stats.date && typeof parsed.count === "number") {
          stats.count = parsed.count;
        }
      }
    } catch (e) { /* 本地存储不可用时仅保留本次会话数据 */ }
    return stats;
  }

  var stats = loadStats();

  function saveStats() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stats));
    } catch (e) { /* 忽略写入失败 */ }
  }

  function renderStats() {
    els.count.textContent = stats.count;
    els.dots.innerHTML = "";
    var shown = Math.min(Math.max(stats.count, 4), 20);
    for (var i = 0; i < shown; i++) {
      var dot = document.createElement("span");
      dot.className = "dot" + (i < stats.count ? " done" : "");
      els.dots.appendChild(dot);
    }
  }

  function formatTime(seconds) {
    var s = Math.max(0, Math.ceil(seconds));
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function render() {
    var leftRatio = total > 0 ? remaining / total : 0;
    els.time.textContent = formatTime(remaining);
    els.progress.style.strokeDashoffset = String(RING_LENGTH * (1 - Math.max(0, Math.min(1, leftRatio))));
    document.title = (running ? "▶ " : "") + formatTime(remaining) + " · " + (mode === "focus" ? "专注" : "休息") + " · 番茄钟";
  }

  function setMode(nextMode) {
    mode = nextMode;
    total = mode === "focus" ? FOCUS_SECONDS : BREAK_SECONDS;
    remaining = total;
    running = false;
    clearInterval(ticker);
    ticker = null;

    var isFocus = mode === "focus";
    document.documentElement.style.setProperty("--accent", isFocus ? "var(--focus)" : "var(--break)");
    els.modeLabel.textContent = isFocus ? "专注时间" : "休息时间";
    els.tabFocus.setAttribute("aria-selected", String(isFocus));
    els.tabBreak.setAttribute("aria-selected", String(!isFocus));
    els.start.textContent = "开始";
    render();
  }

  function tick() {
    var left = (endAt - Date.now()) / 1000;
    remaining = Math.max(0, left);
    if (left <= 0) {
      finish();
      return;
    }
    render();
  }

  function start() {
    if (running) return;
    ensureAudio();
    running = true;
    endAt = Date.now() + remaining * 1000;
    clearInterval(ticker);
    ticker = setInterval(tick, 200);
    els.start.textContent = "暂停";
    render();
  }

  function pause() {
    if (!running) return;
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    running = false;
    clearInterval(ticker);
    ticker = null;
    els.start.textContent = "继续";
    render();
  }

  function reset() {
    clearInterval(ticker);
    ticker = null;
    running = false;
    remaining = total;
    els.start.textContent = "开始";
    render();
  }

  function finish() {
    clearInterval(ticker);
    ticker = null;
    running = false;

    playChime();

    if (mode === "focus") {
      if (stats.date !== todayKey()) {
        stats = { date: todayKey(), count: 0 };
      }
      stats.count += 1;
      saveStats();
      renderStats();
      setMode("break");
    } else {
      setMode("focus");
    }
  }

  function ensureAudio() {
    if (audioCtx) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      return;
    }
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) {
      try { audioCtx = new Ctx(); } catch (e) { audioCtx = null; }
    }
  }

  // 用 Web Audio 合成一段三音提示音，避免依赖外部音频文件
  function playChime() {
    ensureAudio();
    if (!audioCtx) return;
    var now = audioCtx.currentTime;
    var notes = [
      { freq: 880, start: 0 },
      { freq: 1174.66, start: 0.28 },
      { freq: 1567.98, start: 0.56 }
    ];
    notes.forEach(function (note, index) {
      [0, 1.1].forEach(function (offset) {
        var t = now + note.start + offset;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = note.freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 1);
      });
    });
  }

  els.start.addEventListener("click", function () {
    if (running) pause(); else start();
  });

  els.reset.addEventListener("click", reset);

  els.tabFocus.addEventListener("click", function () {
    if (mode !== "focus") setMode("focus");
  });

  els.tabBreak.addEventListener("click", function () {
    if (mode !== "break") setMode("break");
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      if (running) pause(); else start();
    } else if (e.key === "r" || e.key === "R") {
      reset();
    }
  });

  // 跨天时把计数归零
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && stats.date !== todayKey()) {
      stats = { date: todayKey(), count: 0 };
      saveStats();
      renderStats();
    }
    if (!document.hidden && running) tick();
  });

  renderStats();
  setMode("focus");
})();
</script>
</body>
</html>
